<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Career Pathfinder</title>
    <style>
        /* Professional Career Counselor Theme */
        :root {
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --accent: #2563eb;
            --border: #e2e8f0;
        }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: var(--accent); font-size: 2.5rem; }
        .container {
            max-width: 1100px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 25px;
        }
        .panel {
            background: var(--card);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        textarea {
            width: 100%;
            height: 200px;
            background: #fff;
            color: #1e293b;
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            font-size: 1rem;
            resize: none;
            margin-bottom: 15px;
            box-sizing: border-box;
            outline: none;
        }
        textarea:focus { border-color: var(--accent); }
        button {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1.1rem;
            transition: background 0.2s;
        }
        button:hover { background: #1d4ed8; }
        #preview {
            background: #fff;
            border: 2px solid var(--border);
            border-radius: 12px;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .status-msg { font-size: 0.9rem; color: #64748b; margin-top: 15px; font-weight: 500; }
        h3 { color: var(--accent); margin-top: 0; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🚀 AI Career Pathfinder</h1>
        <p>Expert career counseling driven by AI.</p>
    </div>

    <div class="container">
        <div class="panel">
            <h3>Profile Analysis</h3>
            <p style="font-size: 0.9rem; color: #64748b;">Describe your skills, hobbies, and what you enjoy doing.</p>
            <textarea id="userInput" placeholder="e.g., 'I love math and solving puzzles' or 'I am very creative and like to draw'"></textarea>
            <button onclick="predictCareer()">Predict My Future</button>
            <div id="status" class="status-msg">Ready to analyze your profile...</div>
        </div>

        <div class="panel">
            <h3>Your Career Blueprint</h3>
            <div id="preview">
                <p id="placeholderText" style="color: #94a3b8; text-align: center; padding: 20px;">
                    Enter your details and click "Predict My Future" to generate your roadmap.
                </p>
            </div>
        </div>
    </div>

<script>
async function predictCareer() {
    const input = document.getElementById('userInput').value.trim();
    const status = document.getElementById('status');
    const preview = document.getElementById('preview');

    if (!input) return alert("Please enter your skills and interests!");

    status.innerText = "Consulting the Career Architect AI...";
    preview.innerHTML = "<p style='color: #64748b; font-style: italic;'>Analyzing career trends and skill-matching...</p>";

    try {
        const response = await fetch('/api/career-ai', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userInput: input })
        });

        if (!response.ok) throw new Error('Server returned an error');

        const data = await response.json();
        
        // Get the AI response
        const aiMessage = data.text || data.response || "AI response was empty.";      
        preview.innerHTML = `<div style="text-align: left; padding: 20px; line-height: 1.6; color: #1e293b;">${aiMessage}</div>`;
        status.innerText = "Analysis Complete!";
    } catch (error) {
        console.error("Fetch Error:", error);
        preview.innerHTML = `<p style="color: #ef4444; padding: 20px;">Error: ${error.message}</p>`;
        status.innerText = "Connection Error.";
    }
}
</script>
</body>
</html>
